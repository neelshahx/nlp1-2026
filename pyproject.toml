[project]
name = "nlp1-2026"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "baycomp>=1.0.3",
    "certifi>=2026.10.23",
    "datasets>=5.1.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "jupyterlab-lsp>=5.3.0",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["nli"]

[tool.ruff.lint.per-file-ignores]
"project1.py" = ["F401", "B018"]  # imports for later cells; bare expressions display output

[tool.basedpyright]
typeCheckingMode = "standard"
